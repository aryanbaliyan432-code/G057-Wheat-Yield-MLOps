apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp161-api
  labels:
    app: mp161-api
    tier: api
    group: G057
    problem: MP161
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp161-api
  template:
    metadata:
      labels:
        app: mp161-api
    spec:
      containers:
        - name: mp161-container
          image: mp161-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mp161-config
            - secretRef:
                name: mp161-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Readiness probe checks if application and model are ready to receive traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness probe checks if container is healthy; waits longer before starting
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
